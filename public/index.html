<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traffic Camera</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #1c1c1c;
            font-size: 24px;
            font-weight: bold;
        }

        #status {
            margin: 15px;
            font-size: 18px;
            color: orange;
        }

        .camera-container {
            width: 95%;
            max-width: 1000px;
            margin: auto;
        }

        #camera {
            width: 100%;
            min-height: 300px;
            max-height: 75vh;
            object-fit: contain;
            background: black;
            border: 1px solid #333;
        }

        #fps {
            margin-top: 10px;
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    Traffic Camera
</header>

<div id="status">
    Connecting to server...
</div>

<div class="camera-container">

    <img
        id="camera"
        alt="Waiting for ESP32 camera..."
    >

    <div id="fps">
        0 FPS
    </div>

</div>

<script>

const camera = document.getElementById("camera");
const status = document.getElementById("status");
const fpsDisplay = document.getElementById("fps");

let socket;

let previousImageURL = null;

let frames = 0;
let lastFPSUpdate = Date.now();

function connect() {

    // Use WSS automatically when deployed using HTTPS
    const protocol =
        window.location.protocol === "https:"
            ? "wss:"
            : "ws:";

    const address =
        protocol +
        "//" +
        window.location.host +
        "/viewer";

    console.log("Connecting to:", address);

    socket = new WebSocket(address);

    socket.binaryType = "arraybuffer";


    // --------------------------------------
    // WebSocket connected
    // --------------------------------------

    socket.onopen = function() {

        console.log("Viewer connected");

        status.textContent =
            "Connected - Waiting for camera";

        status.style.color =
            "orange";
    };


    // --------------------------------------
    // JPEG frame received
    // --------------------------------------

    socket.onmessage = function(event) {

        const blob =
            new Blob(
                [event.data],
                { type: "image/jpeg" }
            );

        const newImageURL =
            URL.createObjectURL(blob);

        camera.onload = function() {

            if (previousImageURL) {
                URL.revokeObjectURL(
                    previousImageURL
                );
            }

            previousImageURL =
                newImageURL;
        };

        camera.src =
            newImageURL;


        // Camera is now streaming

        status.textContent =
            "● LIVE";

        status.style.color =
            "#00ff88";


        // FPS counter

        frames++;

        const now =
            Date.now();

        if (now - lastFPSUpdate >= 1000) {

            fpsDisplay.textContent =
                frames + " FPS";

            frames = 0;

            lastFPSUpdate = now;
        }
    };


    // --------------------------------------
    // Connection closed
    // --------------------------------------

    socket.onclose = function() {

        console.log("Viewer disconnected");

        status.textContent =
            "Disconnected - reconnecting...";

        status.style.color =
            "red";

        fpsDisplay.textContent =
            "0 FPS";

        setTimeout(
            connect,
            3000
        );
    };


    // --------------------------------------
    // Connection error
    // --------------------------------------

    socket.onerror = function(error) {

        console.log(
            "WebSocket error:",
            error
        );
    };
}

connect();

</script>

</body>
</html>
